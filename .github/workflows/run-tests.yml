name: run-tests

on:
  - push
  - pull_request

jobs:
  run-tests:
    runs-on: ubuntu-latest

    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: [8.5, 8.4, 8.3, 8.2]
        laravel: ['12.*', '13.*']
        dependency-version: [prefer-lowest, prefer-stable]
        include:
          - php: 8.2
            pest: ^3.8.7
          - php: 8.3
            pest: ^4.7.8
          - php: 8.4
            pest: ^4.7.8
          - php: 8.5
            pest: ^4.7.8
          - laravel: 12.*
            testbench: ^10.12
          - laravel: 13.*
            testbench: ^11.3
          - laravel: 13.*
            php: 8.4
            pest: ^5.3.3
          - laravel: 13.*
            php: 8.5
            pest: ^5.3.3
        exclude:
          - laravel: 13.*
            php: 8.2

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.dependency-version }}

    services:
      s3:
        image: motoserver/moto:5.2.4
        ports:
          - 5000:5000
        options: >-
          --health-cmd "curl --fail http://localhost:5000/"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 10

    env:
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: media-library-tests
      AWS_ENDPOINT: http://localhost:5000

    steps:
      - name: Update apt
        run: sudo apt-get update --fix-missing

      - name: Install ffmpeg
        run: sudo apt-get -y install ffmpeg

      - name: Install ghostscript
        run: sudo apt-get -y install ghostscript

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick
          coverage: none

      - name: Setup Problem Matches
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Fix Imagick Policy
        run: sudo sed -i 's/none/read|write/g' /etc/ImageMagick-*/policy.xml

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer require "pestphp/pest:${{ matrix.pest }}" --dev --no-interaction --no-update
          composer remove "larastan/larastan" --dev --no-interaction --no-update
          composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction

      - name: Create S3 test bucket
        run: |
          curl --fail --request PUT "${AWS_ENDPOINT}/${AWS_BUCKET}"
          curl --fail --request PUT "${AWS_ENDPOINT}/${AWS_BUCKET}?policy" --header 'Content-Type: application/json' --data @- <<JSON
          {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":"s3:GetObject","Resource":"arn:aws:s3:::${AWS_BUCKET}/*"}]}
          JSON

      - name: Execute tests
        run: vendor/bin/pest
